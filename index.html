<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="./favicon.ico" type="image/x-icon" />
  <title>Breadboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav id="navbar" style="display:none;">
    <ul>
      <!-- Dashboard buttons -->
      <li id="nav-home"><a href="#" id="homeBtn"><img src="icons/home.png" alt="Home" /></a></li>
      <li id="nav-switchBox"><a href="#" id="switchBoxBtn"><img src="icons/switch.png" alt="Switch Boxes" /></a></li>
      <li style="float:right" id="nav-changeName"><a href="#" id="changeNameBtn"><img src="icons/name.png" alt="Change Name" /></a></li>
      <li style="float:right" id="nav-idealTemp"><a href="#" id="idealTempBtn"><img src="icons/temp.png" alt="Change Ideal Temp" /></a></li>
      <li style="float:right" id="nav-feed"><a href="#" id="feedBtn"><img src="icons/feed.png" alt="Feed Starter" /></a></li>
    </ul>
  </nav>

  <h1 id="header">welcome!</h1>
  <h2 id="subheader" style="display:none;"></h2>

  <!-- Login -->
  <div id="view-login">
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button id="loginBtn">Login</button>
    <button id="showSignupBtn">Create Account</button>
  </div>

  <!-- Signup -->
  <div id="view-signup" style="display:none;">
    <input id="newBoxId" type="text" placeholder="Box ID" />
    <input id="newEmail" type="email" placeholder="Email" />
    <input id="newPassword" type="password" placeholder="Password" />
    <input id="confirmPassword" type="password" placeholder="Confirm Password" />
    <button id="signupBtn">Sign Up</button>
    <button id="backToLoginBtn">Back to Login</button>
  </div>

  <!-- Dashboard -->
  <div id="view-dashboard" style="display:none;">
    <button id="startCycleBtn">Start New Cycle</button>
    <button id="logoutBtn">Logout</button>
  </div>

  <!-- Name -->
  <div id="view-name" style="display:none;">
    <input id="nameInput" type="text" placeholder="Starter Name" />
    <button id="continueBtn">Save</button>
  </div>

  <!-- Temp -->
  <div id="view-temp" style="display:none;">
    <input id="idealTempInput" type="number" placeholder="Ideal Temp (°F)" />
    <button id="setTempBtn">Save</button>
    <button id="resetTempBtn">Reset to Default</button>
  </div>

  <!-- Feed -->
  <div id="view-feed" style="display:none;">
    <button id="logFeedBtn">Log Feeding</button>
  </div>

  <!-- Switch Box -->
  <div id="view-switchBox" style="display:none;">
    <button id="addBoxBtn">Add New Box</button>
    <div id="boxList"></div>
  </div>

  <!-- Add Box -->
  <div id="view-addBox" style="display:none;">
    <input id="newBoxIdInput" type="text" placeholder="Box ID" />
    <button id="saveNewBoxBtn">Add Box</button>
    <button id="cancelAddBtn">Cancel</button>
  </div>

  <script src="firebase-init.js" defer></script>
  <script src="router.js" defer></script>
  <script src="views/auth.js" defer></script>
  <script src="views/dashboard.js" defer></script>
  <script src="views/name.js" defer></script>
  <script src="views/temp.js" defer></script>
  <script src="views/feed.js" defer></script>
  <script src="views/switchBox.js" defer></script>
  <script src="views/addBox.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => initAuth());
  </script>
</body>
</html>
