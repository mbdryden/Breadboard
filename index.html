<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title>Breadboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>welcome!</h1>

  <div id="loginForm">
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button type="button" id="loginBtn">Login</button>
    <button type="button" id="showSignupBtn">Create Account</button>
  </div>

  <div id="signupForm" style="display:none;">
    <input id="newBoxId" type="boxId" placeholder="Box ID" />
    <input id="newEmail" type="email" placeholder="Email" />
    <input id="newPassword" type="password" placeholder="Password" />
    <input id="confirmPassword" type="password" placeholder="Confirm Password" />
    <button type="button" id="signupBtn">Sign Up</button>
    <button type="button" id="backToLoginBtn">Back to Login</button>
  </div>

  <div id="dashboard" style="display:none;">
    <button id="changeNameBtn">Change Starter Name</button>
    <button id="startCycleBtn">Start New Cycle</button>
    <button id="feedBtn">Feed Starter</button>
    <button id="logoutBtn">Logout</button>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
